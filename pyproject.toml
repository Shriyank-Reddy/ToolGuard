[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolguard"
version = "0.1.0"
description = "Static security scanner for AI-agent tool definitions"
requires-python = ">=3.11"
dependencies = ["scikit-learn", "matplotlib", "rich"]

[project.scripts]
toolguard = "toolguard.cli:main"

[tool.setuptools]
packages = ["toolguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
